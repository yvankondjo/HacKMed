services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  telephony-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
      PYTHONUNBUFFERED: "1"
    command: python agents/telephony_agent.py start
    depends_on:
      - backend
    restart: unless-stopped

  consultation-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
      PYTHONUNBUFFERED: "1"
      AGENT_NAME: medvoice-consultation
    command: python agents/consultation_agent.py start
    depends_on:
      - backend
    restart: unless-stopped

  outbound-caller:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
      PYTHONUNBUFFERED: "1"
    command: python agents/outbound_caller.py start
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
